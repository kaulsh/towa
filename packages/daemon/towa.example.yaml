# Example Towa daemon config. Copy to towa.yaml and adjust.
# Secrets (bot token, API keys) stay in the environment — see .env.example.
#
# Start: towa run --config-file ./towa.yaml

db:
  path: ./towa.db

telegram:
  # Single allow-listed private chat id (§7).
  chat_id: "00000000"
  # Optional webhook (omit for long-polling, the default):
  # webhook:
  #   domain: https://example.com
  #   port: 8443
  #   path: /telegraf
  #   host: 127.0.0.1
  #   # secret_token from TELEGRAM_WEBHOOK_SECRET env

models:
  chat:
    # OpenAI-compatible only (§8.2). model + base_url are required
    # (no implicit endpoint — use a recipe / fill in your server).
    model: gemma4:e4b
    base_url: http://127.0.0.1:11434/v1
    # Multimodal capability flags (§7.3 / §8.1). Default false = durable
    # "media present" notes only (no image/voice content in the reply path).
    vision: true
    voice_note_input: true
  embedding:
    provider: local # local | openai-compatible
    model: onnx-community/all-MiniLM-L6-v2-ONNX
    # dimensions: 1536  # required for openai-compatible
    # openai:
    #   base_url: https://api.openai.com/v1

harness:
  # system_prompt: null  # null / omit → pipeline default
  debounce:
    idle_ms: 800
    max_wait_ms: 5000
  session_idle_threshold_sec: 7200

drain:
  poll_interval_ms: 1000

logging:
  # path: null  # default: <dirname(db.path)>/towa.log
  max_bytes: 10485760 # 10 MiB; rotates to .1 then fresh file
  stdout: true

control:
  # Optional; default is 18741 (see control.ts). CLI needs --port or
  # TOWA_CONTROL_PORT if you change this.
  # port: 18741
  # token: optional; or set TOWA_CONTROL_TOKEN in the environment

# Built-in agent tools (§5.4). Omit web.search / web.fetch to disable.
# Secrets via env when the chosen provider needs them:
#   SERPAPI_API_KEY (search: serpapi), FIRECRAWL_API_KEY (search/fetch: firecrawl).
# fetch: fetchapi uses native HTTP fetch — no API key.
tools:
  web:
    # search: serpapi   # or firecrawl
    fetch: fetchapi   # or firecrawl
  fs:
    enabled: false
    # sandbox_root: null  # default: <dirname(db.path)>/sandbox
    allowlist: [] # always-allowed absolute (or config-relative) path prefixes
