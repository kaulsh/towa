# Example Towa daemon config. Copy to towa.yaml and adjust.
# Secrets (bot token, API keys) stay in the environment — see .env.example.
#
# Start: towa run --config-file ./towa.yaml

db:
  path: ./towa.db

telegram:
  # Single allow-listed private chat id (§7).
  chat_id: "000000000"
  # Optional webhook (omit for long-polling, the default):
  # webhook:
  #   domain: https://example.com
  #   port: 8443
  #   path: /telegraf
  #   host: 127.0.0.1
  #   # secret_token from TELEGRAM_WEBHOOK_SECRET env

models:
  chat:
    provider: ollama # ollama | openai-compatible
    model: gemma4:e4b
    # context_window: 8192
    # Multimodal capability flags (§7.3 / §8.1). Default false = durable
    # "media present" notes only (no image/voice content in the reply path).
    # vision: true            # image captioning / generate with image parts
    # voice_note_input: true  # Telegram voice notes via /v1/audio/transcriptions
    #                         # (music / file audio uploads stay unsupported)
    vision: true
    voice_note_input: true
    # ollama_host: http://127.0.0.1:11434
    # openai:
    #   base_url: https://api.openai.com/v1
  embedding:
    provider: local # local | openai-compatible
    model: onnx-community/all-MiniLM-L6-v2-ONNX
    # dimensions: 1536  # required for openai-compatible
    # openai:
    #   base_url: https://api.openai.com/v1

harness:
  # system_prompt: null  # null / omit → pipeline default
  debounce:
    idle_ms: 800
    max_wait_ms: 5000
  session_idle_threshold_sec: 7200
  working_ratio: 0.5
  reserved_for_output_ratio: 0.2

drain:
  poll_interval_ms: 1000

logging:
  # path: null  # default: <dirname(db.path)>/towa.log
  max_bytes: 10485760 # 10 MiB; rotates to .1 then fresh file
  stdout: true

control:
  host: 127.0.0.1
  port: 7432
  # token: optional; or set TOWA_CONTROL_TOKEN in the environment
